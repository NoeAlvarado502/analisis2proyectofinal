<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <g fill="#3A2A22" opacity="0.065">
    <!-- 1. Bloque de construcción gigante relleno con inclinación de -18° -->
    <g transform="translate(85, 80) rotate(-18)">
      <rect x="-36" y="-36" width="20" height="14" rx="4"/>
      <rect x="-10" y="-36" width="20" height="14" rx="4"/>
      <rect x="16" y="-36" width="20" height="14" rx="4"/>
      <rect x="-44" y="-24" width="88" height="52" rx="8"/>
    </g>

    <!-- 2. Pieza de rompecabezas gigante rellena con inclinación de -18° -->
    <g transform="translate(270, 75) rotate(-18)">
      <path d="M -30 -30 h 20 c 0 -8 5 -14 10 -14 s 10 6 10 14 h 20 v 20 c 8 0 14 5 14 10 s -6 10 -14 10 v 20 h -20 c 0 -8 -5 -14 -10 -14 s -10 6 -10 14 h -20 v -20 c 8 0 14 -5 14 -10 s -6 -10 -14 -10 z"/>
    </g>

    <!-- 3. Osito de peluche gigante relleno con inclinación de -18° -->
    <g transform="translate(85, 275) rotate(-18)">
      <circle cx="-28" cy="-26" r="15"/>
      <circle cx="28" cy="-26" r="15"/>
      <circle cx="0" cy="4" r="34"/>
      <!-- Detalles recortados que dejan ver el fondo -->
      <ellipse cx="0" cy="14" rx="14" ry="11" fill="#FFF4DD"/>
      <ellipse cx="0" cy="10" rx="5" ry="3.5" fill="#3A2A22"/>
      <circle cx="-13" cy="0" r="3.5" fill="#FFF4DD"/>
      <circle cx="13" cy="0" r="3.5" fill="#FFF4DD"/>
      <circle cx="-28" cy="-26" r="8" fill="#FFF4DD"/>
      <circle cx="28" cy="-26" r="8" fill="#FFF4DD"/>
    </g>

    <!-- 4. Carrito de juguete gigante relleno con inclinación de -18° -->
    <g transform="translate(270, 275) rotate(-18)">
      <path d="M -45 15 h 10 a 14 14 0 0 1 24 0 h 22 a 14 14 0 0 1 24 0 h 10 v -16 c 0 -5 -3 -9 -8 -11 l -14 -10 c -4 -3 -9 -4 -14 -4 h -22 c -7 0 -13 4 -16 11 l -5 9 h -11 c -4 0 -6 3 -6 6 z"/>
      <path d="M -12 -12 h 18 v 14 h -24 l 4 -10 c 1 -3 3 -4 6 -4 z" fill="#FFF4DD"/>
      <path d="M 10 -12 h 14 c 3 0 6 2 8 5 l 4 9 h -26 z" fill="#FFF4DD"/>
      <circle cx="-23" cy="15" r="10"/>
      <circle cx="33" cy="15" r="10"/>
      <circle cx="-23" cy="15" r="4" fill="#FFF4DD"/>
      <circle cx="33" cy="15" r="4" fill="#FFF4DD"/>
    </g>

    <!-- 5. Estrellas y destellos decorativos gigantes con inclinación de -18° -->
    <g transform="translate(175, 175) rotate(-18)">
      <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z"/>
    </g>
    <g transform="translate(360, 175) rotate(-18)">
      <path d="M 0 -15 Q 0 0 15 0 Q 0 0 0 15 Q 0 0 -15 0 Q 0 0 0 -15 Z"/>
    </g>
    <g transform="translate(0, 175) rotate(-18)">
      <path d="M 0 -15 Q 0 0 15 0 Q 0 0 0 15 Q 0 0 -15 0 Q 0 0 0 -15 Z"/>
    </g>
    <g transform="translate(175, 360) rotate(-18)">
      <path d="M 0 -15 Q 0 0 15 0 Q 0 0 0 15 Q 0 0 -15 0 Q 0 0 0 -15 Z"/>
    </g>
    <g transform="translate(175, 0) rotate(-18)">
      <path d="M 0 -15 Q 0 0 15 0 Q 0 0 0 15 Q 0 0 -15 0 Q 0 0 0 -15 Z"/>
    </g>

    <!-- Puntos de acento decorativo -->
    <circle cx="175" cy="78" r="5"/>
    <circle cx="175" cy="275" r="5"/>
    <circle cx="85" cy="175" r="5"/>
    <circle cx="270" cy="175" r="5"/>
  </g>
</svg>
